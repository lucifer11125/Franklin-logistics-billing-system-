<script>
    // Micro-interactions for form focus states
    document.querySelectorAll('.minimal-input, select').forEach(input => {
        input.addEventListener('focus', () => {
            input.closest('.group')?.querySelector('label')?.classList.add('text-primary');
        });
        input.addEventListener('blur', () => {
            input.closest('.group')?.querySelector('label')?.classList.remove('text-primary');
        });
    });

    // Subtle atmospheric cursor effect
    const glow = document.createElement('div');
    glow.className = 'fixed w-[500px] h-[500px] bg-primary/[0.03] rounded-full blur-[120px] pointer-events-none z-[-1] transition-opacity duration-1000';
    document.body.appendChild(glow);

    document.addEventListener('mousemove', (e) => {
        glow.style.left = `${e.clientX - 250}px`;
        glow.style.top = `${e.clientY - 250}px`;
    });
</script>
